            fixes: {"SQL Injection": {"desc": "SQL Injection occurs when untrusted user input is directly concatenated into a database query.", "secure_code": "\n# PHP (PDO) - Recommended\n$stmt = $pdo->prepare('SELECT * FROM users WHERE email = :email');\n$stmt->execute(['email' => $userInput]);\n$user = $stmt->fetch();\n\n# Python (Flask/SQLAlchemy)\nuser = User.query.filter_by(email=user_input).first()\n\n# Java (Prepared Statement)\nString query = \"SELECT * FROM users WHERE email = ?\";\nPreparedStatement pstmt = connection.prepareStatement(query);\npstmt.setString(1, userInput);\nResultSet results = pstmt.executeQuery();\n", "tips": ["Use Prepared Statements (Parameterized Queries) for ALL database access.", "Use Object Relational Mappers (ORMs) like Eloquent, Hibernate, or SQLAlchemy.", "Validate and sanitize input (e.g., ensure IDs are integers)."]}, "Cross-Site Scripting (XSS)": {"desc": "XSS happens when the application includes untrusted data in a web page without proper validation or escaping.", "secure_code": "\n<!-- HTML Context (General) -->\n<!-- Output Encoding converts special characters into their HTML entities -->\n<div>{{ user_input | e }}</div>  <!-- Jinja2 (Python) -->\n<div><?= htmlspecialchars($user_input, ENT_QUOTES, 'UTF-8') ?></div> <!-- PHP -->\n<div>{userInput}</div> <!-- React (Auto-escapes by default) -->\n\n<!-- JavaScript Context -->\n<script>\n    // NEVER put untrusted data directly here. \n    // Use JSON.stringify() with proper escaping if needed.\n    var data = JSON.parse('{{ data | tojson }}'); \n<\/script>\n", "tips": ["Context-sensitive output encoding is the primary defense.", "Implement Content Security Policy (CSP) headers.", "Use modern frameworks (React, Vue, Angular) which handle escaping automatically."]}, "Broken Authentication": {"desc": "Weak usage of session IDs or credentials allows attackers to impersonate users.", "secure_code": "\n# Password Storage (Python)\nimport bcrypt\n\n# Hashing a password\nhashed = bcrypt.hashpw(password.encode('utf-8'), bcrypt.gensalt())\n\n# Verifying\nif bcrypt.checkpw(user_input.encode('utf-8'), hashed):\n    login_user(user)\n\n# Session Management\n# - Set 'Secure' and 'HttpOnly' flags on cookies.\n# - Set strict session timeouts.\n", "tips": ["Never store passwords in plain text. Use Argon2 or Bcrypt.", "Implement Multi-Factor Authentication (MFA).", "Rate limit login attempts to prevent brute force."]}, "Sensitive Data Exposure": {"desc": "Exposure of sensitive information like keys, passwords, or PII.", "secure_code": "\n# 1. Disable Directory Listing (Apache .htaccess)\nOptions -Indexes\n\n# 2. Deny Access to Sensitive Files (Nginx)\nlocation ~ /\\.(env|git|htaccess) {\n    deny all;\n}\n\n# 3. Environment Variables (Python)\nimport os\nsecret_key = os.environ.get('SECRET_KEY') # Never hardcode secrets!\n", "tips": ["Encrypt data at rest and in transit (HTTPS).", "Ensure .git, .env, and backup files are not accessible via web.", "Use generic error messages to avoid leaking implementation details."]}, "Security Misconfiguration": {"desc": "Insecure default settings, incomplete computations, or open cloud storage.", "secure_code": "\n# HTTP Security Headers (Nginx)\nadd_header X-Frame-Options \"SAMEORIGIN\";\nadd_header X-XSS-Protection \"1; mode=block\";\nadd_header X-Content-Type-Options \"nosniff\";\nadd_header Strict-Transport-Security \"max-age=31536000; includeSubDomains\";\nadd_header Content-Security-Policy \"default-src 'self';\";\n", "tips": ["Remove default accounts and sample pages.", "Keep all software libraries and OS patched.", "Automate configuration verification."]}, "IDOR": {"desc": "Access control failure where users can access resources belonging to others by changing IDs.", "secure_code": "\n# Python (Logic Check)\n@app.route('/document/<doc_id>')\n@login_required\ndef view_document(doc_id):\n    doc = Document.query.get(doc_id)\n    \n    # CRITICAL: Verify Ownership!\n    if doc.owner_id != current_user.id:\n        abort(403) # Forbidden\n        \n    return render_template('doc.html', doc=doc)\n", "tips": ["Never rely on the ID parameter alone found in the URL.", "Always check if the 'current_user' has permission to access the requested object ID.", "Use indirect references (e.g., random GUIDs or session maps) instead of database IDs."]}, "Command Injection": {"desc": "Attackers can execute arbitrary operating system commands via vulnerable inputs.", "secure_code": "\n# Python (subprocess)\nimport subprocess\n\n# VULNERABLE:\n# os.system(\"ping \" + user_input)\n\n# SECURE:\n# Use a list of arguments. This prevents shell expansion.\nsubprocess.run([\"ping\", \"-c\", \"1\", user_input])\n", "tips": ["Avoid calling OS commands directly if possible.", "Use parameterized APIs (e.g., subprocess.run with a list).", "Validate inputs against a strict whitelist."]}, "Directory Traversal": {"desc": "Attackers can access restricted files by using '../' sequences.", "secure_code": "\n# Python\nimport os\n\nfilename = user_input\nbase_dir = '/var/www/images/'\nabs_path = os.path.abspath(os.path.join(base_dir, filename))\n\nif not abs_path.startswith(base_dir):\n    raise PermissionError(\"Access Denied\")\n\n# Safe to open\nwith open(abs_path) as f:\n    ...\n", "tips": ["Validate that the resolved path starts with the expected base directory.", "Use simple alphanumeric filenames where possible.", "Disable directory listing."]}, "Insecure File Upload": {"desc": "Uploading dangerous files (like .php shells) can compromise the server.", "secure_code": "\n# Python (Flask)\nfrom werkzeug.utils import secure_filename\n\nALLOWED_EXTENSIONS = {'png', 'jpg', 'jpeg', 'gif'}\n\ndef allowed_file(filename):\n    return '.' in filename and \\\n           filename.rsplit('.', 1)[1].lower() in ALLOWED_EXTENSIONS\n\nif file and allowed_file(file.filename):\n    filename = secure_filename(file.filename)\n    # Generate a random name to prevent overwrites/execution\n    save_path = os.path.join(UPLOAD_FOLDER, uuid.uuid4().hex + \".png\")\n    file.save(save_path)\n", "tips": ["Whitelist allowed file extensions and MIME types.", "Rename uploaded files to random strings.", "Store uploads outside the web root."]}, "CSRF": {"desc": "Forces an end user to execute unwanted actions on a web application.", "secure_code": "\n<!-- Add CSRF Token to Forms -->\n<form action=\"/transfer\" method=\"POST\">\n    <input type=\"hidden\" name=\"csrf_token\" value=\"{{ csrf_token() }}\">\n    ...\n</form>\n\n# Backend (Flask-WTF does this automatically)\n", "tips": ["Use Anti-CSRF tokens for all state-changing requests (POST, PUT, DELETE).", "Use SameSite cookie attribute (Strict or Lax).", "Require re-authentication for sensitive actions."]}, "SSRF": {"desc": "Server-Side Request Forgery allows attackers to induce the server to make HTTP requests.", "secure_code": "\n# Python\nimport ipaddress\nfrom urllib.parse import urlparse\n\ndef validate_url(url):\n    parsed = urlparse(url)\n    ip = ipaddress.ip_address(parsed.hostname)\n    \n    # Deny private ranges (127.0.0.1, 10.x, 192.168.x, etc.)\n    if ip.is_private:\n        raise ValueError(\"Private IPs not allowed\")\n    \n    return url\n", "tips": ["Validate and sanitize all user-supplied URLs.", "Deny requests to private IP ranges (localhost, 10.0.0.0/8, etc.).", "Run the service in an isolated network environment."]}, "Rate Limiting": {"desc": "Lack of rate limiting allows brute force attacks.", "secure_code": "\n# Nginx\nlimit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;\n\nserver {\n    location /login {\n        limit_req zone=mylimit burst=20 nodelay;\n        ...\n    }\n}\n", "tips": ["Implement rate limiting on all login and intensive endpoints.", "Use CAPTCHAs to prevent automated abuse.", "Monitor for abnormal traffic spikes."]}},

            const targetsContainer = tmpl.getElementById('top-targets-list');
            if(DATA.stats.top_targets.length === 0) {
                targetsContainer.innerHTML = '<div class="text-slate-500 text-sm italic">No vulnerable targets found.</div>';
            } else {
                DATA.stats.top_targets.forEach(t => {
                    targetsContainer.innerHTML += `
                        <div class="flex items-center justify-between p-3 bg-slate-900/50 rounded-lg border border-slate-800 hover:border-slate-700 transition">
                            <div class="flex items-center gap-3 overflow-hidden">
                                <span class="h-8 w-8 rounded bg-slate-800 flex items-center justify-center text-xs font-bold text-slate-400">${t.count}</span>
                                <span class="text-sm font-mono text-slate-300 truncate">${escapeHtml(t.display)}</span>
                            </div>
                            ${t.criticals > 0 ? `<span class="px-2 py-1 rounded text-xs font-bold bg-red-500/20 text-red-500 border border-red-500/20">${t.criticals} Crit</span>` : ''}
                        </div>
                    `;
                });
            }

            container.innerHTML = '';
            container.appendChild(tmpl);

            // Chart
            const ctx = document.getElementById('chart-types').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(DATA.stats.by_type),
                    datasets: [{
                        label: 'Vulnerabilities',
                        data: Object.values(DATA.stats.by_type),
                        backgroundColor: '#0d9488',
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8' } },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                    }
                }
            });
        }

        function renderFindings(container) {
            let findings = DATA.findings;
            
            // filtering
            if (router.filterSev) findings = findings.filter(f => f.severity === router.filterSev);
            if (router.filterCat) findings = findings.filter(f => f.type === router.filterCat);
            if (router.search) {
                const q = router.search.toLowerCase();
                findings = findings.filter(f => 
                    f.type.toLowerCase().includes(q) || 
                    f.location.toLowerCase().includes(q) || 
                    (f.payload && f.payload.toLowerCase().includes(q))
                );
            }

            let html = `<div class="max-w-5xl mx-auto space-y-4 animate-[fadeIn_0.3s_ease-out]">`;
            
            if (findings.length === 0) {
                html += `<div class="p-12 text-center text-slate-500 border border-dashed border-slate-800 rounded-xl">No findings match your criteria.</div>`;
            } else {
                findings.forEach((f, idx) => {
                    const conf = getSeverityConfig(f.severity);
                    const fix = DATA.fixes[f.type] || { secure_code: '# See OWASP guidelines', tips: ['Manual review required'] };
                    // Simple replacement for dynamic fix code
                    let secureCode = fix.secure_code.replace(/user_input/g, f.parameter || 'input');

                    html += `
                    <div class="group bg-slate-900/50 border border-slate-800 rounded-xl overflow-hidden hover:border-slate-700 transition-all duration-200" id="finding-${idx}">
                        <div class="p-5 cursor-pointer flex items-start gap-4" onclick="toggleDetails(${idx})">
                            <div class="mt-1 flex-shrink-0 w-24">
                                <span class="px-3 py-1 rounded text-[10px] font-bold uppercase tracking-wider border ${conf.bg} ${conf.text} ${conf.border} shadow-sm flex items-center justify-center gap-2">
                                    <i class="fa-solid ${conf.icon}"></i> ${f.severity}
                                </span>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex justify-between items-start">
                                    <h3 class="font-bold text-slate-200 text-lg group-hover:text-primary-400 transition-colors">${escapeHtml(f.type)}</h3>
                                    <i class="fa-solid fa-chevron-down text-slate-600 transition-transform duration-300" id="icon-${idx}"></i>
                                </div>
                                <div class="text-xs font-mono text-slate-500 mt-1 truncate">${escapeHtml(f.location)}</div>
                            </div>
                        </div>
                        
                        <div id="details-${idx}" class="hidden border-t border-slate-800/50 bg-slate-950/30">
                            <div class="p-6 grid grid-cols-1 xl:grid-cols-2 gap-8">
                                <div class="space-y-6">
                                    <div>
                                        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">Evidence (Payload)</h4>
                                        <div class="relative group/code">
                                            <pre><code class="language-none text-red-300 text-sm">${escapeHtml(f.payload || 'N/A')}</code></pre>
                                        </div>
                                    </div>
                                    <div>
                                        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3">Impact Analysis</h4>
                                        <p class="text-sm text-slate-400 leading-relaxed">${escapeHtml(f.impact || 'No impact details provided.')}</p>
                                    </div>
                                </div>
                                
                                <div class="space-y-6">
                                    <div>
                                        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-3 text-emerald-500">Recommended Fix</h4>
                                        <div class="bg-[#1d1f21] rounded-lg border border-slate-800 overflow-hidden">
                                            <div class="flex justify-between items-center px-3 py-2 border-b border-slate-800 bg-[#252526]">
                                                <span class="text-[10px] text-slate-500 font-mono">SECURE_CODING_PATTERN</span>
                                            </div>
                                            <pre class="!m-0 !bg-transparent"><code class="language-python">${escapeHtml(secureCode)}</code></pre>
                                        </div>
                                        <div class="mt-3 flex gap-2">
                                            ${ (fix.tips || []).map(tip => `<span class="inline-flex items-center px-2 py-1 rounded bg-slate-800 text-[10px] text-slate-400 border border-slate-700"><i class="fa-solid fa-lightbulb text-yellow-500/50 mr-2"></i> ${tip}</span>`).join('') }
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    `;
                });
            }
            html += `</div>`;
            container.innerHTML = html;
            Prism.highlightAllUnder(container);
        }

        function toggleDetails(idx) {
            const details = document.getElementById(`details-${idx}`);
            const icon = document.getElementById(`icon-${idx}`);
            
            if (details.classList.contains('hidden')) {
                details.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
            } else {
                details.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            // Build Side Nav
            const nav = document.getElementById('category-nav');
            Object.keys(DATA.stats.by_type).sort().forEach(k => {
                const btn = document.createElement('button');
                btn.className = 'w-full flex items-center justify-between px-4 py-2 text-xs text-slate-400 hover:text-white hover:bg-slate-800 rounded transition-colors mb-1 group';
                btn.innerHTML = `<span>${k}</span><span class="bg-slate-800 group-hover:bg-slate-700 px-1.5 py-0.5 rounded text-[10px] text-slate-500 group-hover:text-slate-300 transition">${DATA.stats.by_type[k]}</span>`;
                btn.onclick = () => router.filterCategory(k);
                nav.appendChild(btn);
            });

            // Global Search Listener
            let searchTimeout;
            document.getElementById('global-search').addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    router.view = 'findings';
                    router.search = e.target.value;
                    render();
                }, 300);
            });

            render();
        });
    </script>
</body>
</html>
