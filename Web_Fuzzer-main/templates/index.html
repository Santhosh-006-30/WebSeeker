<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WebSeeker Pro - Advanced Agentic Security Scanner Dashboard">
    <title>WebSeeker Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        /* [Existing CSS Styles] */
        :root {
            --bg-color: #050505;
            --card-bg: rgba(25, 25, 35, 0.6);
            --accent-color: #7c3aed;
            --accent-glow: #7c3aed80;
            --text-color: #e2e8f0;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(124, 58, 237, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.15) 0%, transparent 40%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            margin-bottom: 3rem;
            text-align: center;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 2rem;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
        }

        .input-group {
            position: relative;
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            font-family: 'JetBrains Mono', monospace;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        button.btn-scan {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0 2.5rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            min-width: 160px;
            /* Prevent layout shift */
        }

        button.btn-scan:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        button.btn-scan:disabled {
            filter: grayscale(1);
            cursor: not-allowed;
            transform: none;
        }

        /* Progress Area */
        .progress-container {
            margin-bottom: 2rem;
            display: none;
            /* Hidden initially */
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
            width: 100%;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, var(--accent-color), var(--info));
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .status-text {
            text-align: right;
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Logs Console */
        .console-window {
            background: #000;
            border-radius: 12px;
            height: 300px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .log-entry {
            display: flex;
            gap: 1rem;
            opacity: 0;
            animation: slideIn 0.2s forwards;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            padding-bottom: 4px;
        }

        .log-time {
            color: #64748b;
            font-size: 0.8em;
            min-width: 60px;
        }

        .log-msg {
            color: #e2e8f0;
        }

        .log-info .log-msg {
            color: #93c5fd;
        }

        .log-success .log-msg {
            color: #86efac;
        }

        .log-warning .log-msg {
            color: #fcd34d;
        }

        .log-error .log-msg {
            color: #fca5a5;
        }

        /* Results Area */
        .results-area {
            margin-top: 2rem;
            display: none;
            text-align: center;
        }

        .result-btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 1rem 2rem;
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            margin: 0 0.5rem;
            transition: all 0.3s;
        }

        .result-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #fff;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            h1 {
                font-size: 2.5rem;
            }

            .glass-card {
                padding: 1.5rem;
            }

            .input-group {
                flex-direction: column;
                gap: 0.8rem;
            }

            button.btn-scan {
                width: 100%;
                padding: 1rem;
            }

            .console-window {
                height: 250px;
                font-size: 0.8rem;
            }
        }
    </style>

</head>

<body>
    <div class="container">
        <header>
            <h1>WebSeeker Pro</h1>
            <p class="subtitle">Advanced Agentic Security Scanner</p>
        </header>
        <div class="glass-card">
            <div class="input-group">
                <label for="targetUrl" class="sr-only">Target URL</label>
                <input type="text" id="targetUrl" name="targetUrl" placeholder="Enter target URL (e.g., http://example.com)" value="" aria-label="Target URL">
                <button class="btn-scan" onclick="startScan()" id="scanBtn" aria-label="Start Security Scan">Start Scan</button>
                <button class="btn-scan" onclick="stopScan()" id="stopBtn" aria-label="Stop Security Scan" style="background:var(--danger); display:none;">Stop</button>
            </div>
            
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
                <div class="flex justify-between mt-2">
                     <div class="status-text" id="etaText">ETA: Calculating...</div>
                     <div class="status-text" id="statusText">Initialized</div>
                </div>
            </div>
            <div class="console-window" id="consoleWindow">
                <div class="log-entry log-info"><span class="log-time">--:--</span><span class="log-msg">Ready to scan...</span></div>
            </div>
            <div class="results-area" id="resultsArea">
                <h3 style="margin-bottom: 1rem;">Scan Complete</h3>
                <div id="downloadLinks">
                    <!-- Links will be injected here -->
                </div>
            </div>
        </div>
    </div>
    <script>
        const scanBtn = document.getElementById('scanBtn');
        const stopBtn = document.getElementById('stopBtn');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const consoleWindow = document.getElementById('consoleWindow');
        const resultsArea = document.getElementById('resultsArea');
        const downloadLinks = document.getElementById('downloadLinks');
        const etaText = document.getElementById('etaText');
        const statusText = document.getElementById('statusText');

        function log(type, message) {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            entry.innerHTML = `<span class="log-time">${time}</span><span class="log-msg">${message}</span>`;
            consoleWindow.appendChild(entry);
            consoleWindow.scrollTop = consoleWindow.scrollHeight;
        }

        let eventSource;

        async function stopScan() {
            if (!confirm("Are you sure you want to stop the scan?")) return;
            
            try {
                await fetch('/stop', { method: 'POST' });
                log('warning', 'Stopping scan...');
                stopBtn.disabled = true;
                stopBtn.innerText = "Stopping...";
            } catch (e) {
                alert("Failed to stop scan");
            }
        }

        async function startScan() {
            const url = document.getElementById('targetUrl').value;

            if (!url) {
                alert("Please enter a URL");
                return;
            }

            // Reset UI
            scanBtn.style.display = 'none';
            stopBtn.style.display = 'inline-block';
            stopBtn.disabled = false;
            stopBtn.innerText = "Stop";
            
            progressContainer.style.display = 'block';
            resultsArea.style.display = 'none';
            consoleWindow.innerHTML = '';
            progressBar.style.width = '0%';
            etaText.innerText = "ETA: Calculating...";
            statusText.innerText = "Starting...";

            // Connect to stream first
            if (eventSource) eventSource.close();
            eventSource = new EventSource('/stream');

            eventSource.onmessage = function (e) {
                if (e.data === ": keep-alive") return;

                const data = JSON.parse(e.data);

                if (data.type === 'log') {
                    const entry = document.createElement('div');
                    entry.className = `log-entry log-${data.level}`;
                    entry.innerHTML = `<span class="log-msg">${data.message}</span>`;
                    consoleWindow.appendChild(entry);
                    consoleWindow.scrollTop = consoleWindow.scrollHeight;
                }
                else if (data.type === 'progress') {
                    progressBar.style.width = data.value + '%';
                    statusText.innerText = data.value + '% Complete';
                }
                else if (data.type === 'eta') {
                    const seconds = parseInt(data.value);
                    const mins = Math.floor(seconds / 60);
                    const secs = seconds % 60;
                    etaText.innerText = `ETA: ~${mins}m ${secs}s`;
                }
                else if (data.type === 'complete') {
                    finishScan(data.results);
                }
                else if (data.type === 'error') {
                    eventSource.close();
                    resetButtons();
                    alert("Error: " + data.message);
                }
            };

            // Trigger Scan
            try {
                const response = await fetch('/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                const res = await response.json();

                if (res.status === 'error') {
                    alert(res.message);
                    resetButtons();
                    eventSource.close();
                }
            } catch (err) {
                console.error(err);
                alert("Failed to start scan");
                resetButtons();
            }
        }
        
        function resetButtons() {
            scanBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
        }

        function finishScan(results) {
            eventSource.close();
            resetButtons();
            progressBar.style.width = '100%';
            statusText.innerText = "100% Complete";
            etaText.innerText = "ETA: Done";
            
            if (results) {
                showResults(results);
            }
        }


        function showResults(results) {
            resultsArea.style.display = 'block';
            // paths are absolute on server, we need to serve them via /reports/ endpoint
            // results.html_report is absolute path string presumably

            // Extract filename from path
            const getFilename = (path) => path.split(/[\\/]/).pop();

            downloadLinks.innerHTML = ` <a href="/reports/${getFilename(results.html_report)}" target="_blank" class="result-btn">📄 View HTML Report</a><a href="/reports/${getFilename(results.json_report)}" target="_blank" class="result-btn"> {}

            JSON Data</a><a href="/reports/${getFilename(results.csv_report)}" target="_blank" class="result-btn">📊 CSV Export</a>`;

            log('success', `Scan finished ! $ {
                    results.vulnerability_count
                }

                vulnerabilities found.`);
        }

    </script>
</body>

</html>
